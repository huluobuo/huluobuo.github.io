<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f7f9">
    <title>盲文艺术字生成器</title>
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body class="page-ascll">
    <!-- 视频背景（与首页一致，跟随鼠标视差） -->
    <div class="bg-stage" id="bg-stage">
        <video id="bg-video" src="./assets/media/video/【哲风壁纸】Kuroha作品-动漫线稿.mp4" autoplay muted loop playsinline></video>
        <div class="bg-veil"></div>
    </div>
    <div class="app">
        <header class="topbar">
            <div class="tb-brand">
                <span class="logo-dot">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><circle cx="9" cy="7" r="1.8"/><circle cx="15" cy="7" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="17" r="1.8"/><circle cx="15" cy="17" r="1.8"/></svg>
                </span>
                <h1>盲文艺术字生成器</h1>
            </div>
            <div class="tb-status" id="status">就绪</div>
        </header>

        <main class="body">
            <!-- 左：生成设置 -->
            <section class="card" aria-label="生成设置">
                <div class="card-head">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>
                    生成设置
                </div>

                <div class="field">
                    <span class="f-ic">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                    </span>
                    <input type="text" id="textInput" class="input" placeholder="输入要转换的文字" value="点赞" maxlength="20">
                </div>

                <div class="grid2">
                    <div class="field">
                        <span class="f-ic">
                            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>
                        </span>
                        <select id="fontSize" class="input">
                            <option value="40">40px (小)</option>
                            <option value="60">60px (中)</option>
                            <option value="80" selected>80px (大)</option>
                            <option value="100">100px (特大)</option>
                            <option value="120">120px (超大)</option>
                        </select>
                    </div>
                    <div class="field">
                        <span class="f-ic">
                            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>
                        </span>
                        <select id="fontFamily" class="input">
                            <option value="KaiTi, 楷体, STKaiti, 'Microsoft YaHei'">楷体 (系统)</option>
                            <option value="SimSun, 宋体, STSong, 'Microsoft YaHei'">宋体 (系统)</option>
                            <option value="SimHei, 黑体, STHeiti, 'Microsoft YaHei'">黑体 (系统)</option>
                            <option value="custom">自定义字体文件…</option>
                        </select>
                    </div>
                </div>

                <div class="font-preview" id="fontPreview">点赞</div>

                <div id="fontUpload" style="display:none;">
                    <label class="up-btn" for="fontFile">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
                        选择字体文件 (.ttf/.otf)
                    </label>
                    <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" style="display:none;">
                    <div class="font-status" id="fontStatus"></div>
                </div>
            </section>

            <!-- 右：输出结果 -->
            <section class="card out-card" aria-label="输出结果">
                <div class="card-head">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 20h10"/></svg>
                    输出结果
                </div>
                <div class="output-box" id="output"></div>
                <div class="output-meta">
                    <span>
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>
                        <b id="charCount">0</b> 字符
                    </span>
                    <span>
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>
                        <b id="rowCount">0</b> 行 × <b id="colCount">0</b> 列
                    </span>
                </div>
            </section>
        </main>

        <!-- 底部操作栏 -->
        <div class="action-bar">
            <button class="act primary" id="generateBtn" type="button">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/></svg>
                生成
            </button>
            <button class="act" id="copyBtn" type="button">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                复制
            </button>
            <button class="act" id="downloadBtn" type="button">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                下载
            </button>
        </div>
    </div>

    <div id="toast"></div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script src="./assets/js/main.js"></script>
</body>
</html>
