<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>huluobuo · 个人主页</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #15161a;
            --panel-elevated: #1c1d22;
            --border: #2a2b30;
            --text: #f0f1f5;
            --sub: #8b8d97;
            --accent: #4f86ff;
            --accent-hover: #6a9aff;
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at 12% 0%, #1a1d26 0%, transparent 42%),
                radial-gradient(circle at 88% 100%, #1f1b2e 0%, transparent 42%),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-tag {
            font-size: 12px;
            color: var(--sub);
        }

        .hero {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 48px 36px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            animation: fade-in-up 0.6s ease-out;
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-greeting {
            font-size: 14px;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .hero-title {
            font-size: 40px;
            font-weight: 800;
            margin: 0 0 16px 0;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .hero-desc {
            font-size: 15px;
            color: var(--sub);
            line-height: 1.7;
            max-width: 640px;
            margin: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin: 8px 0 14px 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--accent);
            border-radius: 2px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
            transition: transform .2s, border-color .2s, box-shadow .2s;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            animation: fade-in-up 0.6s ease-out backwards;
        }
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(79,134,255,0.2), 0 8px 30px rgba(0,0,0,0.35);
        }
        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--panel-elevated);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }
        .card-desc {
            font-size: 13px;
            color: var(--sub);
            line-height: 1.6;
            margin: 0;
            flex: 1;
        }
        .card-link {
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }
        .card:hover .card-link {
            color: var(--accent-hover);
        }

        footer {
            flex-shrink: 0;
            text-align: center;
            padding: 20px;
            color: var(--sub);
            font-size: 12px;
            border-top: 1px solid var(--border);
        }
        footer a {
            color: var(--accent);
            text-decoration: none;
        }
        footer a:hover {
            color: var(--accent-hover);
        }

        @media (max-width: 640px) {
            .app { padding: 12px; gap: 12px; }
            .hero { padding: 32px 22px; }
            .hero-title { font-size: 30px; }
            .hero-desc { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>huluobuo</h1>
            <span class="header-tag">个人主页</span>
        </header>

        <section class="hero">
            <div class="hero-greeting">HELLO, I'M HULUOBUO</div>
            <h2 class="hero-title">欢迎来到我的小站</h2>
            <p class="hero-desc">
                这里收录了一些我平时写的小工具和作品。每个项目都是独立的小应用，专注于做好一件事。
                欢迎浏览、试用，也欢迎提出建议。
            </p>
        </section>

        <div>
            <div class="section-title">项目列表</div>
            <div class="cards">
                <a class="card" href="./music.html">
                    <div class="card-icon">🎵</div>
                    <h3 class="card-title">音乐播放器</h3>
                    <p class="card-desc">
                        支持多源搜索（网易云、QQ、酷我、JOOX），聚合展示搜索结果，
                        实时同步歌词、专辑封面和播放进度。
                    </p>
                    <span class="card-link">进入 →</span>
                </a>

                <a class="card" href="./ascll.html">
                    <div class="card-icon">⠿</div>
                    <h3 class="card-title">盲文艺术字生成器</h3>
                    <p class="card-desc">
                        将任意文字转换为盲文点阵艺术字，支持多种系统字体和自定义字体上传，
                        可一键复制或下载为文本文件。
                    </p>
                    <span class="card-link">进入 →</span>
                </a>
            </div>
        </div>
    </div>

    <footer>
        © 2026 huluobuo · Built with care
    </footer>
</body>
</html>
