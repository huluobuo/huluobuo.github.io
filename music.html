<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>音乐播放器</title>
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #15161a;
      --panel-elevated: #1c1d22;
      --border: #2a2b30;
      --text: #f0f1f5;
      --sub: #8b8d97;
      --accent: #4f86ff;
      --accent-hover: #6a9aff;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background:
        radial-gradient(circle at 12% 0%, #1a1d26 0%, transparent 42%),
        radial-gradient(circle at 88% 100%, #1f1b2e 0%, transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    #player-status { font-size: 12px; color: var(--sub); }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      min-height: 0;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .panel-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .input {
      flex: 1;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #0e0f12;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,134,255,0.15); }

    .btn {
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .1s, background .2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: var(--panel-elevated); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #25262b; }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel-elevated);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .1s;
    }
    .btn-icon:hover { background: #25262b; }
    .btn-icon:active { transform: scale(0.94); }
    .play-btn {
      width: 58px;
      height: 58px;
      font-size: 24px;
      background: var(--accent);
      border: none;
      color: #fff;
      box-shadow: 0 6px 22px rgba(79,134,255,0.35);
    }
    .play-btn:hover { background: var(--accent-hover); }

    /* 搜索 */
    .search-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .source-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .source-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background .2s;
    }
    .source-chip:hover { background: #25262b; }
    .source-chip input { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); }
    .source-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .source-dot.netease { background: #ff6b6b; }
    .source-dot.qq { background: #4dd0e1; }
    .source-dot.kuwo { background: #ba68c8; }
    .source-dot.joox { background: #65f7c4; }

    .limit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 12px;
    }
    .limit-row select {
      background: #0e0f12;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      outline: none;
    }
    .search-stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 12px;
    }

    .search-list { flex: 1; overflow-y: auto; padding-right: 6px; }
    .search-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s;
    }
    .search-item:hover { background: var(--panel-elevated); }
    .search-item.playing { background: rgba(79,134,255,0.12); border: 1px solid rgba(79,134,255,0.25); }
    .search-item .index { color: var(--sub); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
    .search-item .meta { display: flex; flex-direction: column; overflow: hidden; }
    .search-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    .search-item .artist { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .search-item .src { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--sub); padding: 3px 9px; background: #0e0f12; border-radius: 999px; }

    /* 播放器 */
    .player-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 16px 22px;
      overflow: hidden;
    }
    .player-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      max-width: 160px;
    }
    .cover-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 14px;
      background: var(--panel-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .cover-placeholder { color: var(--sub); font-size: 13px; }
    .player-info { text-align: center; }
    .track-title { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 12px; color: var(--sub); margin-top: 3px; }
    .track-source {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 2px 8px;
      margin-top: 4px;
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--sub);
    }

    .player-right {
      flex: 1;
      min-width: 0;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    .player-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .progress-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .time { width: 42px; text-align: center; color: var(--sub); font-variant-numeric: tabular-nums; }
    .progress-wrapper {
      flex: 1;
      height: 6px;
      background: #2a2b30;
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      touch-action: none;
    }
    .progress-bar { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: var(--accent); border-radius: 999px; }
    .progress-handle {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .progress-wrapper:hover .progress-handle { display: block; }

    .control-row { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; }
    .control-main { display: flex; align-items: center; gap: 12px; }
    .control-secondary { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--sub); }
    .volume-slider { width: 100px; accent-color: var(--accent); }

    .playmode-row { display: flex; justify-content: center; align-items: center; gap: 8px; }
    .playmode-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel-elevated);
      color: var(--sub);
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
    }
    .playmode-btn:hover { background: #25262b; color: var(--text); }
    .playmode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* 歌词 */
    .lyrics-panel { flex: 1; min-height: 0; padding: 0; overflow: hidden; }
    .lyrics-container {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }
    .lyrics-inner {
      text-align: center;
      line-height: 1.9;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 24px;
      box-sizing: border-box;
    }
    .lyrics-title-line { font-size: 13px; color: var(--sub); margin-bottom: 14px; }
    .lyrics-line { font-size: 14px; color: var(--sub); margin: 10px 0; transition: all .25s; opacity: 0.55; }
    .lyrics-line.active { color: var(--accent); font-weight: 700; opacity: 1; font-size: 22px; text-shadow: 0 0 20px rgba(79,134,255,0.35); }
    .lyrics-empty { color: var(--sub); font-size: 14px; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: #222;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 1000;
    }
    #toast.show { opacity: 1; }

    .search-list::-webkit-scrollbar,
    .lyrics-container::-webkit-scrollbar { width: 6px; }
    .search-list::-webkit-scrollbar-track,
    .lyrics-container::-webkit-scrollbar-track { background: #111; border-radius: 999px; }
    .search-list::-webkit-scrollbar-thumb,
    .lyrics-container::-webkit-scrollbar-thumb { background: #444; border-radius: 999px; }
    .search-list, .lyrics-container { scrollbar-width: thin; scrollbar-color: #444 #111; }

    @media (max-width: 1000px) {
      .layout { grid-template-columns: 280px 1fr; }
    }
    @media (max-width: 760px) {
      .app { padding: 12px; gap: 12px; }
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow-y: auto;
      }
      .right-col { grid-template-rows: auto auto; }
      body { overflow: auto; }
      .panel { min-height: 260px; }
      .player-panel { flex-direction: column; gap: 16px; }
      .player-left { max-width: none; }
      .cover-wrapper { width: 140px; height: 140px; }
      .player-right { width: 100%; max-width: none; }
      .track-title { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>音乐播放器</h1>
      <div id="player-status">空闲</div>
    </header>

    <main class="layout">
      <!-- 左：搜索 + 结果 -->
      <section class="panel search-panel">
        <div class="panel-title">歌曲搜索</div>
        <div class="search-row">
          <input id="search-input" class="input" type="text" placeholder="输入歌名 / 歌手，回车搜索" />
          <button id="search-btn" class="btn">搜索</button>
        </div>

        <div class="source-row">
          <label class="source-chip">
            <span class="source-dot netease"></span>
            <input type="checkbox" data-source="netease" checked />
            <span>网易云</span>
          </label>
          <label class="source-chip">
            <span class="source-dot qq"></span>
            <input type="checkbox" data-source="qq" checked />
            <span>QQ</span>
          </label>
          <label class="source-chip">
            <span class="source-dot kuwo"></span>
            <input type="checkbox" data-source="kuwo" checked />
            <span>酷我</span>
          </label>
          <label class="source-chip">
            <span class="source-dot joox"></span>
            <input type="checkbox" data-source="joox" />
            <span>JOOX</span>
          </label>
        </div>

        <div class="limit-row">
          <span>每个源加载</span>
          <select id="limit-select">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
          <span>首结果</span>
          <button id="load-more-btn" class="btn btn-secondary">加载更多</button>
        </div>

        <div class="search-stats">
          <span id="search-status">尚未搜索，试试输入“林俊杰”？</span>
          <span id="search-count">0</span>
        </div>

        <div id="search-list" class="search-list"></div>
      </section>

      <!-- 右侧：播放器 + 歌词 -->
      <div class="right-col">
        <section class="panel player-panel">
          <div class="player-left">
            <div class="cover-wrapper">
              <img id="cover-img" src="" alt="cover" />
              <div id="cover-placeholder" class="cover-placeholder">无封面</div>
            </div>
            <div class="player-info">
              <div id="track-title" class="track-title">暂未选择歌曲</div>
              <div id="track-artist" class="track-artist"></div>
              <div id="track-source" class="track-source" style="display:none;"></div>
            </div>
          </div>

          <div class="player-right">
            <div class="player-controls">
              <div class="progress-row">
                <span id="current-time" class="time">00:00</span>
                <div id="progress-wrapper" class="progress-wrapper">
                  <div id="progress-bar" class="progress-bar"></div>
                  <div id="progress-handle" class="progress-handle"></div>
                </div>
                <span id="total-time" class="time">00:00</span>
              </div>
              <div class="control-row">
                <div class="control-main">
                  <button id="prev-btn" class="btn-icon" title="上一首">⏮</button>
                  <button id="play-btn" class="btn play-btn" title="播放/暂停">▶</button>
                  <button id="next-btn" class="btn-icon" title="下一首">⏭</button>
                  <button id="download-btn" class="btn-icon" title="下载当前歌曲">⬇</button>
                </div>
                <div class="playmode-row">
                  <button class="playmode-btn active" data-mode="list" title="列表循环">🔁</button>
                  <button class="playmode-btn" data-mode="single" title="单曲循环">🔂</button>
                  <button class="playmode-btn" data-mode="shuffle" title="随机播放">🔀</button>
                </div>
              </div>
              <div class="control-secondary">
                <span>音量</span>
                <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" />
              </div>
            </div>
          </div>

          <audio id="audio" preload="metadata"></audio>
        </section>

        <section class="panel lyrics-panel">
          <div class="panel-title">歌词</div>
          <div id="lyrics-container" class="lyrics-container">
            <div id="lyrics-inner" class="lyrics-inner">
              <div class="lyrics-empty">暂无歌词，试着播放一首支持歌词的歌曲。</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="toast"></div>

  <script>
  (function(){
    const sourceNames = {
      netease: '网易云',
      qq: 'QQ音乐',
      kuwo: '酷我',
      joox: 'JOOX'
    };

    const state = {
      enabledSources: { netease: true, qq: true, kuwo: true, joox: false },
      perSourceLimit: 10,
      perSourceCurrentLimit: { netease: 10, qq: 10, kuwo: 10, joox: 10 },
      perSourcePage: { netease: 1, qq: 1, kuwo: 1, joox: 1 },

      searchKeyword: '',
      searchResults: [],
      trackMap: new Map(),
      currentTrack: null,
      playContext: { type: 'results', index: -1, playlistId: null },
      playMode: 'list',
      isPlaying: false,
      lyricLines: [],
      currentLyricIndex: -1,
      searchInProgress: false,
      noMoreResults: false,
      muted: false
    };

    let playSession = 0;

    const dom = {};

    function $(id){ return document.getElementById(id); }

    function showToast(msg){
      const toast = $('toast');
      if(!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function formatTime(sec){
      if(!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function getInterleavedSearchList(){
      const grouped = { netease: [], qq: [], kuwo: [], joox: [] };
      state.searchResults.forEach(t => { if(grouped[t.source]) grouped[t.source].push(t); });
      Object.keys(grouped).forEach(k => grouped[k].sort((a, b) => (a.displayIndex || 0) - (b.displayIndex || 0)));
      const order = ['netease', 'qq', 'kuwo', 'joox'];
      const idx = { netease: 0, qq: 0, kuwo: 0, joox: 0 };
      const out = [];
      let added = true;
      while(added){
        added = false;
        for(const s of order){
          const arr = grouped[s];
          const i = idx[s];
          if(arr && i < arr.length){ out.push(arr[i]); idx[s]++; added = true; }
        }
      }
      return out;
    }

    // ===================== 各平台搜索 =====================

    async function searchNetease(kw, page, num){
      const requestLimit = Math.max(1, page || 1) * Math.max(1, num || 10);
      const url = `https://api.qijieya.cn/meting/?type=search&id=${encodeURIComponent(kw)}&limit=${encodeURIComponent(requestLimit)}&server=netease`;
      let added = 0;

      function pickQueryParam(rawUrl, key){
        if(!rawUrl) return '';
        try{
          return new URL(rawUrl, window.location.href).searchParams.get(key) || '';
        }catch(e){
          const m = String(rawUrl).match(new RegExp('[?&]' + key + '=([^&]+)'));
          return m ? decodeURIComponent(m[1]) : '';
        }
      }

      try{
        const res = await fetch(url);
        const json = await res.json();
        if(!Array.isArray(json)) return 0;

        json.forEach((it, idx) => {
          const songId = pickQueryParam(it.url, 'id') || `${kw}-${idx+1}`;
          const uid = `netease-${songId}`;
          if(state.trackMap.has(uid)) return;

          const track = {
            uid,
            source: 'netease',
            displayIndex: idx + 1,
            keyword: kw,
            songid: songId,
            title: it.name || '',
            artist: it.artist || '',
            album: '',
            cover: it.pic || null,
            audioUrl: it.url || null,
            lrc: null,
            lrcUrl: it.lrc || null,
            detailsLoaded: false,
            quality: null,
            qualityLabel: null
          };
          state.trackMap.set(uid, track);
          state.searchResults.push(track);
          added++;
        });
      }catch(e){ console.error('netease(qijieya meting)', e); }
      return added;
    }

    async function searchQQ(kw, limit){
      const url = `https://tang.api.s01s.cn/music_open_api.php?msg=${encodeURIComponent(kw)}&type=json`;
      let added = 0;

      try{
        const res = await fetch(url);
        const json = await res.json();
        const data = Array.isArray(json) ? json : (Array.isArray(json?.data) ? json.data : []);
        if(!Array.isArray(data) || data.length === 0) return 0;

        const list = data.slice(0, limit || data.length);
        list.forEach((it, idx) => {
          const mid = it.song_mid;
          if(!mid) return;
          const uid = `qq-${mid}`;
          if(state.trackMap.has(uid)) return;

          const indexInList = idx + 1;
          const track = {
            uid,
            source: 'qq',
            displayIndex: indexInList,
            keyword: kw,
            qqSearchKey: kw,
            qqIndex: indexInList,
            qqId: mid,
            songid: mid,
            songMid: mid,
            title: it.song_title || '',
            artist: it.singer_name || '',
            album: '',
            cover: null,
            audioUrl: null,
            lrc: null,
            lrcUrl: null,
            detailsLoaded: false,
            quality: null,
            qualityLabel: null,
            qqQualityText: it.pay || null,
            pay: it.pay || null
          };
          state.trackMap.set(uid, track);
          state.searchResults.push(track);
          added++;
        });
      }catch(e){ console.error('qq search (tang)', e); }
      return added;
    }

    async function searchKuwo(kw, limit){
      const url = `https://kw-api.cenguigui.cn/?name=${encodeURIComponent(kw)}&page=1&limit=${encodeURIComponent(limit)}`;
      let added = 0;
      try{
        const res = await fetch(url);
        const json = await res.json();
        if(json.code !== 200 || !Array.isArray(json.data)) return 0;

        json.data.forEach((it, idx) => {
          const uid = `kuwo-${it.rid}`;
          if(state.trackMap.has(uid)) return;

          const track = {
            uid,
            source: 'kuwo',
            displayIndex: idx + 1,
            keyword: kw,
            songid: it.rid,
            title: it.name || '',
            artist: it.artist || '',
            album: it.album || '',
            cover: it.pic || null,
            audioUrl: null,
            lrc: null,
            lrcUrl: null,
            detailsLoaded: false,
            quality: null,
            qualityLabel: null
          };
          state.trackMap.set(uid, track);
          state.searchResults.push(track);
          added++;
        });
      }catch(e){ console.error('kuwo search', e); }
      return added;
    }

    const JOOX_TOKEN = 'f84ao9lMF_q7husBWRfgUw';
    const JOOX_BR = 4;

    async function searchJoox(kw, limit){
      const url = `https://apicx.asia/api/joox_music?msg=${encodeURIComponent(kw)}&token=${encodeURIComponent(JOOX_TOKEN)}&br=${encodeURIComponent(JOOX_BR)}`;
      let added = 0;
      try{
        const res = await fetch(url);
        const json = await res.json();
        const songs = json && json.code === 200 && json.data && Array.isArray(json.data.songs) ? json.data.songs : [];
        songs.slice(0, limit || songs.length).forEach((it, idx) => {
          const songMid = it.songmid || '';
          const songId = it['歌曲ID'] || songMid || (idx + 1);
          const uid = `joox-${songMid || songId}`;
          if(state.trackMap.has(uid)) return;

          const track = {
            uid,
            source: 'joox',
            displayIndex: idx + 1,
            keyword: kw,
            jooxIndex: idx + 1,
            songid: songId,
            songMid: songMid,
            title: it['歌曲名称'] || '',
            artist: it['歌手'] || '',
            album: it['专辑'] || '',
            cover: null,
            audioUrl: null,
            lrc: it['歌词内容'] || null,
            lrcUrl: null,
            detailsLoaded: false,
            quality: null,
            qualityLabel: null
          };
          state.trackMap.set(uid, track);
          state.searchResults.push(track);
          added++;
        });
      }catch(e){ console.error('joox search', e); }
      return added;
    }

    // ===================== 聚合搜索 =====================

    async function searchAllSources(reset){
      if(!state.searchKeyword){ showToast('请先输入搜索关键词。'); return; }
      const enabled = Object.keys(state.enabledSources).filter(k => state.enabledSources[k]);
      if(!enabled.length){ showToast('请至少选择一个音乐源。'); return; }
      state.searchInProgress = true;
      dom.searchStatus.textContent = '正在搜索中…';

      if(reset){
        Object.keys(state.perSourceCurrentLimit).forEach(k => state.perSourceCurrentLimit[k] = state.perSourceLimit);
        Object.keys(state.perSourcePage).forEach(k => state.perSourcePage[k] = 1);
        state.searchResults = [];
        state.trackMap.clear();
        state.noMoreResults = false;
      }

      const kw = state.searchKeyword;
      const tasks = [];
      for(const s of enabled){
        const limit = state.perSourceCurrentLimit[s] || state.perSourceLimit;
        if(s === 'netease') tasks.push(searchNetease(kw, state.perSourcePage.netease || 1, state.perSourceLimit));
        if(s === 'qq') tasks.push(searchQQ(kw, limit));
        if(s === 'kuwo') tasks.push(searchKuwo(kw, limit));
        if(s === 'joox') tasks.push(searchJoox(kw, limit));
      }

      let added = 0;
      try{
        const res = await Promise.all(tasks);
        added = res.reduce((a, b) => a + (b || 0), 0);
      }catch(e){
        console.error(e);
        showToast('搜索时发生了一点小错误，请稍后再试。');
      }

      state.searchInProgress = false;
      dom.searchStatus.textContent = '搜索完成。';
      dom.searchCount.textContent = state.searchResults.length.toString();
      renderSearchList();
      if(!state.currentTrack && state.searchResults.length){ playFromList('results', 0); }
      if(!reset){
        if(added === 0){ state.noMoreResults = true; showToast('已经没有更多搜索结果啦~'); }
        else state.noMoreResults = false;
      }
    }

    function canAutoLoadMore(){ return !state.searchInProgress && !state.noMoreResults; }

    function requestMoreResults(){
      const enabled = Object.keys(state.enabledSources).filter(k => state.enabledSources[k]);
      if(!enabled.length) return;
      enabled.forEach(src => {
        if(src === 'netease'){
          state.perSourcePage.netease = (state.perSourcePage.netease || 1) + 1;
        }else{
          state.perSourceCurrentLimit[src] = (state.perSourceCurrentLimit[src] || state.perSourceLimit) + state.perSourceLimit;
        }
      });
      searchAllSources(false);
    }

    // ===================== 统一根据音频链接后缀判断音质 =====================

    function inferQualityFromUrl(url){
      if(!url) return { tag: null, label: '' };
      let base = url.split('?')[0].toLowerCase();
      const m = base.match(/\.([a-z0-9]+)$/);
      const ext = m ? m[1] : '';
      const losslessExts = ['flac', 'wav', 'ape', 'alac', 'aiff'];
      if(losslessExts.includes(ext)) return { tag: 'lossless', label: 'LOSSLESS' };
      return { tag: '320k', label: '320K' };
    }

    // ===================== 各平台详情 =====================

    async function fetchNeteaseDetails(track){
      if(track.songid){
        if(!track.audioUrl){
          track.audioUrl = `https://api.qijieya.cn/meting/?server=netease&type=url&id=${encodeURIComponent(track.songid)}`;
        }
        if(!track.lrcUrl){
          track.lrcUrl = `https://api.qijieya.cn/meting/?server=netease&type=lrc&id=${encodeURIComponent(track.songid)}`;
        }
      }

      if(track.audioUrl){
        const q = inferQualityFromUrl(track.audioUrl);
        track.quality = q.tag;
        track.qualityLabel = q.label;
      }

      if(!track.lrc && track.lrcUrl){
        try{
          const lr = await fetch(track.lrcUrl);
          const contentType = (lr.headers.get('content-type') || '').toLowerCase();
          if(contentType.includes('json')){
            const lj = await lr.json();
            track.lrc =
              (typeof lj === 'string' ? lj : null) ||
              lj?.lrc ||
              lj?.lyric ||
              lj?.data?.lrc ||
              lj?.data?.lyric ||
              (typeof lj?.data === 'string' ? lj.data : null) ||
              track.lrc ||
              null;
          }else{
            track.lrc = await lr.text();
          }
        }catch(e){ console.warn('netease lyric fetch failed', e); }
      }
      track.detailsLoaded = true;
    }

    async function fetchQQDetails(track){
      const msg = (track.qqSearchKey || track.keyword || '').trim() || ((track.title || '') + ' ' + (track.artist || '')).trim();
      const mid = (track.qqId || track.songMid || track.songid || '').toString().trim();
      if(!mid) return;

      const url = `https://tang.api.s01s.cn/music_open_api.php?msg=${encodeURIComponent(msg)}&type=json&mid=${encodeURIComponent(mid)}`;

      function pickBestPlayUrl(d){
        if(d.song_play_url_sq) return { url: d.song_play_url_sq, tag: 'lossless', label: 'LOSSLESS', text: `SQ ${d.kbps_sq || ''}`.trim() };
        if(d.song_play_url_pq) return { url: d.song_play_url_pq, tag: 'lossless', label: 'LOSSLESS', text: `PQ ${d.kbps_pq || ''}`.trim() };
        if(d.song_play_url_accom) return { url: d.song_play_url_accom, tag: 'hq', label: 'HQ', text: `ACCOM ${d.kbps_accom || ''}`.trim() };
        if(d.song_play_url_hq) return { url: d.song_play_url_hq, tag: 'hq', label: 'HQ', text: `HQ ${d.kbps_hq || ''}`.trim() };
        if(d.song_play_url_standard) return { url: d.song_play_url_standard, tag: 'standard', label: 'STD', text: `STD ${d.kbps_standard || ''}`.trim() };
        if(d.song_play_url_fq) return { url: d.song_play_url_fq, tag: 'low', label: 'LOW', text: `FQ ${d.kbps_fq || ''}`.trim() };
        if(d.song_play_url) return { url: d.song_play_url, tag: null, label: null, text: null };
        return { url: null, tag: null, label: null, text: null };
      }

      try{
        const res = await fetch(url);
        const d = await res.json();
        if(!d || typeof d !== 'object' || !d.song_mid){ throw new Error('qq detail error (invalid response)'); }

        track.title = d.song_title || d.song_name || track.title;
        track.artist = d.singer_name || track.artist;
        track.album = d.album_name || d.album_title || track.album || '';
        track.cover = d.album_pic || d.singer_pic || track.cover;
        track.pageUrl = d.song_h5_url || track.pageUrl;

        const best = pickBestPlayUrl(d);
        track.audioUrl = best.url || track.audioUrl;
        track.lrc = d.song_lyric || d.lyric || track.lrc;
        track.qqQualityText = best.text || (d.vip ? `VIP:${d.vip}` : null) || track.qqQualityText;

        if(best.tag && best.label){
          track.quality = best.tag;
          track.qualityLabel = best.label;
        }
        if(track.audioUrl){
          const q = inferQualityFromUrl(track.audioUrl);
          if(q && q.label){ track.quality = q.tag; track.qualityLabel = q.label; }
        }
        track.detailsLoaded = true;
      }catch(e){ console.error('qq detail (tang)', e); }
    }

    async function fetchKuwoDetails(track){
      const api = `https://kw-api.cenguigui.cn/?id=${encodeURIComponent(track.songid)}&type=song&level=zp&format=json`;
      const res = await fetch(api);
      const j = await res.json();
      if(!j || j.code !== 200 || !j.data) throw new Error('kuwo kw-api detail failed');

      const d = j.data;
      Object.assign(track, {
        title: d.name || track.title,
        artist: d.artist || track.artist,
        album: d.album || track.album,
        cover: d.pic || track.cover,
        audioUrl: d.url || track.audioUrl,
        lrc: d.lyric || track.lrc || null,
        lrcUrl: null,
        detailsLoaded: true
      });

      if(track.audioUrl){
        const q = inferQualityFromUrl(track.audioUrl);
        track.quality = q.tag;
        track.qualityLabel = q.label;
      }
    }

    async function fetchJooxDetails(track){
      const n = track.jooxIndex || track.displayIndex || 1;
      const url = `https://apicx.asia/api/joox_music?msg=${encodeURIComponent(track.keyword)}&n=${encodeURIComponent(n)}&token=${encodeURIComponent(JOOX_TOKEN)}&br=${encodeURIComponent(JOOX_BR)}`;
      const res = await fetch(url);
      const j = await res.json();
      if(!j || j.code !== 200 || !j.data) throw new Error('joox detail failed');

      const d = j.data;
      const playLinks = d['播放链接'] || {};

      async function probeJooxAudioUrl(u){
        if(!u) return false;
        async function request(method, extraOptions){
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 3000);
          try{
            const res = await fetch(u, Object.assign({ method, cache: 'no-store', redirect: 'follow', signal: controller.signal }, extraOptions || {}));
            return res && (res.ok || res.status === 206 || (res.status >= 200 && res.status < 400));
          }finally{ clearTimeout(timer); }
        }
        try{ if(await request('HEAD')) return true; }catch(e){}
        try{ return await request('GET', { headers: { Range: 'bytes=0-0' } }); }catch(e){ return false; }
      }

      async function pickJooxPlayUrl(links){
        const order = ['Atmos全景声','无损FLAC','Hi-Res无损','母带无损','OGG 320','MP3 320','AAC 192','OGG 192','MP3 128','AAC 96','AAC 48'];
        for(const name of order){
          const u = links[name];
          if(!u) continue;
          if(!(await probeJooxAudioUrl(u))) continue;
          if(/母带|无损|flac|hi-res|atmos/i.test(name) || /\.flac(?:\?|$)/i.test(u)){
            return { url: u, tag: 'lossless', label: 'LOSSLESS', text: name };
          }
          const m = name.match(/(\d+)$/);
          if(m) return { url: u, tag: m[1] + 'k', label: m[1] + 'K', text: name };
          return { url: u, tag: null, label: null, text: name };
        }
        return { url: null, tag: null, label: null, text: null };
      }

      const best = await pickJooxPlayUrl(playLinks);
      Object.assign(track, {
        title: d['歌曲名称'] || track.title,
        artist: d['歌手'] || track.artist,
        album: d['专辑'] || track.album,
        songid: d['歌曲ID'] || track.songid,
        songMid: d.songmid || track.songMid,
        audioUrl: best.url || track.audioUrl,
        lrc: d['歌词内容'] || track.lrc || null,
        lrcUrl: null,
        jooxQualityText: best.text || track.jooxQualityText || null,
        detailsLoaded: true
      });

      if(best.tag && best.label){
        track.quality = best.tag;
        track.qualityLabel = best.label;
      }else if(track.audioUrl){
        const q = inferQualityFromUrl(track.audioUrl);
        track.quality = q.tag;
        track.qualityLabel = q.label;
      }
    }

    async function ensureTrackDetails(track){
      if(track.detailsLoaded && track.audioUrl && (track.lrc || !track.lrcUrl)) return;
      dom.playerStatus.textContent = '加载音源中…';
      if(track.source === 'netease') await fetchNeteaseDetails(track);
      else if(track.source === 'kuwo') await fetchKuwoDetails(track);
      else if(track.source === 'joox') await fetchJooxDetails(track);
      else await fetchQQDetails(track);
    }

    // ===================== 歌词处理 =====================

    function parseLRC(txt){
      if(!txt) return [];
      const lines = txt.split(/\r?\n/);
      const reg = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/;
      const out = [];
      for(const line of lines){
        const m = reg.exec(line);
        if(!m) continue;
        const min = parseInt(m[1], 10) || 0;
        const sec = parseInt(m[2], 10) || 0;
        const ms = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) : 0;
        const time = min * 60 + sec + ms / 1000;
        const text = line.replace(reg, '').trim();
        if(text) out.push({ time, text });
      }
      out.sort((a, b) => a.time - b.time);
      return out;
    }

    function renderLyrics(){
      const wrap = dom.lyricsInner;
      wrap.innerHTML = '';
      state.currentLyricIndex = -1;
      state.lyricEls = [];
      const track = state.currentTrack;

      const titleLine = document.createElement('div');
      titleLine.className = 'lyrics-title-line';
      if(track){ titleLine.textContent = (track.title || '') + (track.artist ? ' - ' + track.artist : ''); }
      wrap.appendChild(titleLine);

      const arr = state.lyricLines;
      if(!arr.length){
        const empty = document.createElement('div');
        empty.className = 'lyrics-empty';
        empty.textContent = '暂无歌词，试着播放一首支持歌词的歌曲。';
        wrap.appendChild(empty);
        return;
      }
      arr.forEach((ln, i) => {
        const div = document.createElement('div');
        div.className = 'lyrics-line';
        div.textContent = ln.text;
        state.lyricEls.push(div);
        wrap.appendChild(div);
      });
      centerLyrics();
      updateLyricsHighlight(dom.audio.currentTime || 0);
    }

    function centerLyrics(){
      const box = dom.lyricsContainer;
      const inner = dom.lyricsInner;
      if(!box || !inner) return;
      const h = box.clientHeight;
      const active = inner.querySelector('.lyrics-line.active');
      const line = active || inner.querySelector('.lyrics-line') || inner.querySelector('.lyrics-title-line') || inner.firstElementChild;
      const lineH = line ? line.offsetHeight : 0;
      const top = Math.max(0, Math.floor(h * 1 - lineH / 2));
      const bottom = Math.max(0, h - top - lineH);
      inner.style.paddingTop = top + 'px';
      inner.style.paddingBottom = bottom + 'px';
    }

    function updateLyricsHighlight(time){
      const lines = state.lyricLines;
      const els = state.lyricEls;
      if(!lines.length || !els || !els.length) return;
      let idx = state.currentLyricIndex;
      if(idx < 0 || idx >= lines.length || time < lines[idx].time || (idx + 1 < lines.length && time >= lines[idx + 1].time)){
        idx = -1;
        for(let i = 0; i < lines.length; i++){
          if(time >= lines[i].time - 0.05) idx = i;
          else break;
        }
      }
      if(idx < 0 || idx === state.currentLyricIndex) return;
      state.currentLyricIndex = idx;
      els.forEach(el => el.classList.remove('active'));
      const act = els[idx];
      if(act){
        act.classList.add('active');
        centerLyrics();
        const box = dom.lyricsContainer;
        const target = act.offsetTop + act.offsetHeight / 2 - box.clientHeight * 1;
        box.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
      }
    }

    // ===================== 播放控制 =====================

    function updateCover(track){
      if(track && track.cover){
        dom.coverImg.src = track.cover;
        dom.coverImg.style.display = 'block';
        dom.coverPlaceholder.style.display = 'none';
      }else{
        dom.coverImg.style.display = 'none';
        dom.coverPlaceholder.style.display = 'flex';
      }
    }

    async function playTrack(track, context){
      if(!track) return;
      const session = ++playSession;
      state.currentTrack = track;
      state.playContext = context || state.playContext;

      dom.trackTitle.textContent = track.title || '';
      dom.trackArtist.textContent = track.artist || '';
      const sk = track.source;
      dom.trackSource.style.display = 'inline-flex';
      dom.trackSource.className = 'track-source source-' + sk;
      dom.trackSource.innerHTML = '';
      const dot = document.createElement('span');
      dot.className = 'source-dot ' + sk;
      const txt = document.createElement('span');
      txt.textContent = sourceNames[sk] || sk;
      dom.trackSource.appendChild(dot);
      dom.trackSource.appendChild(txt);
      updateCover(track);

      dom.playerStatus.textContent = '加载音源中…';
      state.lyricLines = track.lrc ? parseLRC(track.lrc) : [];
      renderLyrics();

      try{
        await ensureTrackDetails(track);
        if(session !== playSession) return;
        dom.trackTitle.textContent = track.title || '';
        dom.trackArtist.textContent = track.artist || '';
        updateCover(track);
        state.lyricLines = track.lrc ? parseLRC(track.lrc) : [];
        renderLyrics();
        if(!track.audioUrl){ showToast('播放失败，请稍后再试。'); dom.playerStatus.textContent = '空闲'; renderSearchList(); return; }
        dom.audio.pause();
        dom.audio.src = track.audioUrl;
        await dom.audio.play();
        if(session !== playSession) return;
        state.isPlaying = true;
        dom.playBtn.textContent = '⏸';
        dom.playerStatus.textContent = '播放中';
      }catch(e){
        if(e && e.name === 'AbortError') return;
        console.error(e);
        showToast('播放失败，请稍后再试。');
        dom.playerStatus.textContent = '空闲';
      }
      renderSearchList();
    }

    function getActiveList(){
      return getInterleavedSearchList();
    }

    function playFromList(type, index, plId){
      const list = getActiveList();
      if(!list.length) return;
      if(index < 0) index = list.length - 1;
      if(index >= list.length) index = 0;
      state.playContext = { type, index, playlistId: plId || null };
      playTrack(list[index], state.playContext);
    }

    function playNext(direction){
      const list = getActiveList();
      if(!list.length) return;
      let idx = state.playContext.index ?? -1;
      if(idx < 0 || idx >= list.length) idx = 0;

      if(state.playMode === 'single'){
        dom.audio.currentTime = 0;
        dom.audio.play().catch(() => {});
        return;
      }
      if(state.playMode === 'shuffle'){
        if(list.length === 1){
          idx = 0;
        }else{
          let newIdx;
          do{ newIdx = Math.floor(Math.random() * list.length); }while(newIdx === idx);
          idx = newIdx;
        }
      }else{
        idx = (idx + (direction === 'prev' ? -1 : 1) + list.length) % list.length;
      }
      playFromList(state.playContext.type, idx, state.playContext.playlistId);
    }

    function togglePlayPause(){
      if(!dom.audio.src) return;
      if(state.isPlaying) dom.audio.pause();
      else dom.audio.play().catch(e => { if(e && e.name !== 'AbortError') console.error(e); });
    }

    function handleDownloadCurrent(){
      const tr = state.currentTrack;
      if(!tr || !tr.audioUrl){ showToast('音源未加载，请稍后再试。'); return; }
      window.open(tr.audioUrl, '_blank');
    }

    // ===================== 搜索结果渲染 =====================

    function renderSearchList(){
      const wrap = dom.searchList;
      wrap.innerHTML = '';
      const out = getInterleavedSearchList();
      out.forEach((track, i) => {
        const item = document.createElement('div');
        item.className = 'search-item';
        if(state.currentTrack && state.currentTrack.uid === track.uid) item.classList.add('playing');

        const idx = document.createElement('div');
        idx.className = 'index';
        idx.textContent = i + 1;

        const meta = document.createElement('div');
        meta.className = 'meta';
        const tt = document.createElement('div');
        tt.className = 'title';
        tt.textContent = track.title || 'Unknown';
        const ar = document.createElement('div');
        ar.className = 'artist';
        ar.textContent = track.artist || '';
        meta.appendChild(tt);
        meta.appendChild(ar);

        const src = document.createElement('div');
        src.className = 'src';
        const dot = document.createElement('span');
        dot.className = 'source-dot ' + track.source;
        const srcName = document.createElement('span');
        srcName.textContent = sourceNames[track.source] || track.source;
        src.appendChild(dot);
        src.appendChild(srcName);

        item.appendChild(idx);
        item.appendChild(meta);
        item.appendChild(src);
        item.addEventListener('click', () => {
          const visible = getInterleavedSearchList();
          const index = visible.findIndex(x => x.uid === track.uid);
          playFromList('results', index);
        });
        wrap.appendChild(item);
      });
    }

    // ===================== 进度条拖拽/点击 =====================

    let isDraggingProgress = false;

    function setProgressFromEvent(e){
      const rect = dom.progressWrapper.getBoundingClientRect();
      const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const dur = dom.audio.duration || 0;
      if(dur > 0) dom.audio.currentTime = dur * r;
    }

    // ===================== DOM / 事件绑定 =====================

    function setupDOM(){
      dom.searchInput = $('search-input');
      dom.searchBtn = $('search-btn');
      dom.limitSelect = $('limit-select');
      dom.loadMoreBtn = $('load-more-btn');
      dom.searchStatus = $('search-status');

      dom.progressWrapper = $('progress-wrapper');
      dom.progressBar = $('progress-bar');
      dom.progressHandle = $('progress-handle');
      dom.volumeSlider = $('volume-slider');
      dom.lyricsInner = $('lyrics-inner');
      dom.lyricsContainer = $('lyrics-container');
    }

    function setPlaymodeUI(){
      document.querySelectorAll('.playmode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.playMode);
      });
    }

    function setupEvents(){
      dom.searchBtn.addEventListener('click', () => {
        state.searchKeyword = dom.searchInput.value.trim();
        state.noMoreResults = false;
        searchAllSources(true);
      });
      dom.searchInput.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          state.searchKeyword = dom.searchInput.value.trim();
          state.noMoreResults = false;
          searchAllSources(true);
        }
      });

      document.querySelectorAll('.source-chip input').forEach(cb => {
        cb.addEventListener('change', () => { state.enabledSources[cb.dataset.source] = cb.checked; });
      });

      dom.limitSelect.addEventListener('change', () => {
        state.perSourceLimit = parseInt(dom.limitSelect.value, 10) || 10;
      });

      dom.loadMoreBtn.addEventListener('click', () => {
        const enabled = Object.keys(state.enabledSources).filter(k => state.enabledSources[k]);
        if(!enabled.length){ showToast('请至少选择一个音乐源。'); return; }
        enabled.forEach(s => {
          if(s === 'netease'){
            state.perSourcePage.netease = (state.perSourcePage.netease || 1) + 1;
          }else{
            state.perSourceCurrentLimit[s] = (state.perSourceCurrentLimit[s] || state.perSourceLimit) + state.perSourceLimit;
          }
        });
        state.noMoreResults = false;
        searchAllSources(false);
      });

      dom.searchList.addEventListener('scroll', () => {
        if(!canAutoLoadMore()) return;
        if(dom.searchList.scrollTop + dom.searchList.clientHeight >= dom.searchList.scrollHeight - 10){
          requestMoreResults();
        }
      });

      dom.playBtn.addEventListener('click', togglePlayPause);
      dom.prevBtn.addEventListener('click', () => playNext('prev'));
      dom.nextBtn.addEventListener('click', () => playNext('next'));
      dom.downloadBtn.addEventListener('click', handleDownloadCurrent);

      dom.volumeSlider.addEventListener('input', () => {
        dom.audio.volume = parseFloat(dom.volumeSlider.value);
      });

      dom.audio.addEventListener('timeupdate', () => {
        const cur = dom.audio.currentTime || 0;
        const dur = dom.audio.duration || 0;
        dom.currentTime.textContent = formatTime(cur);
        dom.totalTime.textContent = formatTime(dur || 0);
        if(dur > 0){
          const r = cur / dur;
          dom.progressBar.style.transform = 'scaleX(' + r + ')';
          const w = dom.progressWrapper.clientWidth;
          dom.progressHandle.style.left = (w * r) + 'px';
        }
        updateLyricsHighlight(cur);
      });
      dom.audio.addEventListener('play', () => {
        state.isPlaying = true;
        dom.playBtn.textContent = '⏸';
        dom.playerStatus.textContent = '播放中';
      });
      dom.audio.addEventListener('pause', () => {
        state.isPlaying = false;
        dom.playBtn.textContent = '▶';
        dom.playerStatus.textContent = '已暂停';
      });
      dom.audio.addEventListener('ended', () => { playNext('next'); });
      dom.audio.addEventListener('error', e => {
        if(!e || !e.target || !e.target.error) return;
        const code = e.target.error.code;
        if(code === e.target.error.MEDIA_ERR_ABORTED){
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        console.error('Audio error', e);
      });

      dom.progressWrapper.addEventListener('pointerdown', e => {
        isDraggingProgress = true;
        setProgressFromEvent(e);
        dom.progressWrapper.setPointerCapture(e.pointerId);
      });
      dom.progressWrapper.addEventListener('pointermove', e => {
        if(isDraggingProgress) setProgressFromEvent(e);
      });
      dom.progressWrapper.addEventListener('pointerup', e => {
        isDraggingProgress = false;
        if(dom.progressWrapper.hasPointerCapture(e.pointerId)) dom.progressWrapper.releasePointerCapture(e.pointerId);
      });

      document.querySelectorAll('.playmode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.playMode = btn.dataset.mode;
          setPlaymodeUI();
          if(state.playMode === 'list') showToast('播放模式：列表循环');
          else if(state.playMode === 'single') showToast('播放模式：单曲循环');
          else showToast('播放模式：随机播放');
        });
      });

      window.addEventListener('resize', () => {
        centerLyrics();
        updateLyricsHighlight(dom.audio.currentTime || 0);
      });
    }

    function init(){
      setupDOM();
      setupEvents();
      setPlaymodeUI();
      dom.audio.volume = parseFloat(dom.volumeSlider.value);
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
